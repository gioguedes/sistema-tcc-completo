# Broker de TESTE para a bancada do TCC — rede local apenas, sem autenticacao.
# Uso: & "C:\Program Files\mosquitto\mosquitto.exe" -c <este arquivo> -v
listener 1883 0.0.0.0
allow_anonymous true

# Log verboso em arquivo. O stdout do broker, quando redirecionado, fica
# bufferizado e engole as linhas de PUBLISH -- que sao exatamente a evidencia do
# QoS 1 (aparecem como "q1"). Com log_dest file a escrita e imediata.
# broker.log fica fora do git (.gitignore).
log_dest file C:\Users\rafael\Desktop\TCC\sistema\ferramentas\broker.log
log_type all
